<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Club has moved</title>
    <meta name="description" content="OG Club has moved. Continue to the new OG Club website.">
    <meta name="theme-color" content="#090b10">
    <meta property="og:site_name" content="OG Club">
    <meta property="og:title" content="OG Club has moved">
    <meta property="og:description" content="Continue to the new OG Club website.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./social-card.png">
    <meta property="og:image:alt" content="OG Club has moved">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta http-equiv="refresh" content="0; url=https://og-club-members-only-priced-by-t.sites.imd.fun/">
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --text: #f2f0e9;
        --accent: #ffd166;
        --accent-hover: #ffdd8d;
        --accent-ink: #231a08;
        --focus: #ffe4a4;
        --text-body: 1rem;
        --text-heading: 2rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-block-size: 100vh;
        min-block-size: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
      }

      main {
        inline-size: 100%;
        max-inline-size: 32rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: var(--text-heading);
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: -0.02em;
        text-wrap: balance;
        overflow-wrap: break-word;
      }

      a {
        display: inline-block;
        max-inline-size: 100%;
        min-block-size: 3rem;
        padding: 0.75rem 1.5rem;
        border: 1px solid transparent;
        border-radius: 0.5rem;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: var(--text-body);
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
        overflow-wrap: break-word;
      }

      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      @media (hover: hover) {
        a:hover { background: var(--accent-hover); }
      }

      a:active { text-decoration: underline; }

      @media (forced-colors: active) {
        a { border-color: LinkText; }
        a:focus-visible { outline-color: Highlight; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OG Club has moved</h1>
      <a href="https://og-club-members-only-priced-by-t.sites.imd.fun/">Go to OG Club</a>
    </main>
  </body>
</html>
